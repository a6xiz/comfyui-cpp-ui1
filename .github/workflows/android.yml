name: Build Android APK

on:
  workflow_dispatch:        # gives you a "Run workflow" button in the Actions tab
  push:
    branches: [main, master]

env:
  QT_VERSION: "6.10.3"
  NDK_VERSION: "27.2.12479018"

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The GitHub runner already has the Android SDK, so we only add what Qt 6.10 / 6.12 need.
      # (The "setup-android" action is not used: it fails with the newest tools.)
      - name: Android platform, build-tools and NDK (what Qt 6.10 / 6.12 need)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;${NDK_VERSION}"

      # Qt for Android needs the normal desktop Qt too (to run moc, rcc, qmlcachegen...)
      - name: Qt for Linux (desktop tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}
          cache: true
          set-env: false

      # Qt 6.7+ for Android is stored in a different place on Qt's server, and the
      # "install-qt-action" cannot look it up (that was the "No latest version" error).
      # So we call the installer tool (aqt) directly for the Android part.
      - name: Python for the Qt installer tool
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Qt for Android (arm64)
        run: |
          python3 -m pip install "aqtinstall==3.3.*" "py7zr==1.1.0"
          python3 -m aqt install-qt linux android "${QT_VERSION}" android_arm64_v8a -O "$RUNNER_TEMP/Qt"
          ls "$RUNNER_TEMP/Qt/${QT_VERSION}"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Using your own key from the repository secrets"
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            PASS="$KEYSTORE_PASS"
          else
            echo "No secret found: making a temporary key (each build gets a new signature)"
            PASS="comfyclient"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias comfyclient \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=ComfyClient"
          fi
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_ALIAS=comfyclient" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=$PASS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Build the APK
        run: |
          QT_ANDROID="$RUNNER_TEMP/Qt/${QT_VERSION}/android_arm64_v8a"
          QT_HOST="$RUNNER_TEMP/Qt/${QT_VERSION}/gcc_64"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$QT_ANDROID/bin/qt-cmake" -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST" \
            -DANDROID_SDK_ROOT="$SDK" \
            -DANDROID_NDK_ROOT="$SDK/ndk/${NDK_VERSION}" \
            -DQT_ANDROID_SIGN_APK=ON
          cmake --build build --target apk

      - name: Collect the APK
        run: |
          APK=$(find build -name "*.apk" | grep -i signed | head -n1)
          [ -z "$APK" ] && APK=$(find build -name "*.apk" | head -n1)
          echo "APK found: $APK"
          mkdir -p out
          cp "$APK" out/ComfyClient.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ComfyClient-apk
          path: out/ComfyClient.apk
